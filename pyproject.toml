[project]
name = "sitesyncai"
version = "0.1.0"
description = "SiteSync AI — Intelligent Data Capture & Schedule-Linking Layer for Infrastructure Project Management"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "SiteSync AI Team", email = "team@sitesyncai.dev" }
]

dependencies = [
    "streamlit>=1.40.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-community>=0.3.0",
    "langchain-core>=0.3.0",
    "openai>=1.50.0",
    "chromadb>=0.5.0",
    "scikit-learn>=1.5.0",
    "numpy>=1.26.0",
    "sqlalchemy>=2.0.0",
    "pdfplumber>=0.11.0",
    "openpyxl>=3.1.0",
    "pandas>=2.2.0",
    "azure-ai-documentintelligence>=1.0.0",
    "azure-core>=1.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "python-dotenv>=1.0.0",
    "requests>=2.32.0",
    "httpx>=0.27.0",
    "tenacity>=9.0.0",
    "rich>=13.7.0",
    "python-dateutil>=2.9.0",
    "Pillow>=10.4.0",
    "SpeechRecognition>=3.10.0",
    "rapidfuzz>=3.0.0",
    "plotly>=5.18.0",
    "typer>=0.9.0",
    "faster-whisper>=1.0.0",
    "python-multipart>=0.0.6",
    # ── REST API layer ────────────────────────────────────────────────────────
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
]

[project.scripts]
sitesync-seed = "sitesync.db.seed:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sitesync"]

[dependency-groups]
dev = [
    "ipython>=8.26.0",
    "pytest>=9.1.1",
    "pytest-httpx>=0.30.0",
    "ruff>=0.6.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
# Prevent a single broken import from aborting all test collection
filterwarnings = [
    "ignore::DeprecationWarning",
]
