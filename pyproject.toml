[project]
name = "sitesyncai"
version = "0.1.0"
description = "SiteSync AI — Intelligent Data Capture & Schedule-Linking Layer for Infrastructure Project Management"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "SiteSync AI Team", email = "team@sitesyncai.dev" }
]

dependencies = [
    # ─── Web framework ─────────────────────────────────────────────────────────
    "streamlit>=1.40.0",

    # ─── LLM Orchestration ─────────────────────────────────────────────────────
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-community>=0.3.0",
    "langchain-core>=0.3.0",
    "openai>=1.50.0",

    # ─── Vector Storage (ChromaDB — pure Python, no torch needed) ──────────────
    "chromadb>=0.5.0",

    # ─── Maths for cosine similarity (tiny, no GPU needed) ─────────────────────
    "scikit-learn>=1.5.0",
    "numpy>=1.26.0",

    # ─── Database ──────────────────────────────────────────────────────────────
    "sqlalchemy>=2.0.0",

    # ─── Document Parsing ──────────────────────────────────────────────────────
    "pdfplumber>=0.11.0",
    "openpyxl>=3.1.0",
    "pandas>=2.2.0",

    # ─── Azure Document Intelligence (OCR) ─────────────────────────────────────
    "azure-ai-documentintelligence>=1.0.0",
    "azure-core>=1.30.0",

    # ─── Configuration & Utilities ─────────────────────────────────────────────
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "python-dotenv>=1.0.0",
    "requests>=2.32.0",
    "httpx>=0.27.0",
    "tenacity>=9.0.0",
    "rich>=13.7.0",

    # ─── Data Processing ───────────────────────────────────────────────────────
    "python-dateutil>=2.9.0",
    "Pillow>=10.4.0",
    "SpeechRecognition>=3.10.0",
]

[project.scripts]
sitesync-seed = "sitesync.db.seed:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sitesync"]

[dependency-groups]
dev = [
    "ipython>=8.26.0",
    "ruff>=0.6.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
